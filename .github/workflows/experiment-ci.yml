name: Experiment CI - cargo check

on:
  push:
    branches:
      - edidada/main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.97.1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.97.1"
      # Same cache setup as upstream ci.yml (workspace shared key).
      - uses: Swatinem/rust-cache@v2
        with:
          env-vars: ImageOS
          shared-key: workspace
          save-if: false
      # Same compile gates as the upstream PR check job.
      - name: Check (cargo check --all)
        run: cargo check --all
      - name: Check examples compile
        run: cargo check --examples
